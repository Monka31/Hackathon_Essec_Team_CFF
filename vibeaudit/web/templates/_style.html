<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5b6573; --line:#e3e6ea; --accent:#1f4fd8;
          --critical:#b42318; --high:#d9480f; --medium:#b7791f; --low:#2f6f9f; --ok:#2b8a3e; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:16px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  .hint { font-weight:400; color:var(--muted); font-size:13px; }
  input[type=text], input[type=url], input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .check { display:flex; gap:10px; align-items:flex-start; margin-top:18px; font-weight:400; }
  .check input { margin-top:4px; }
  button, .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 18px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; margin-top:18px; }
  .error { background:#fdecea; color:var(--critical); border-radius:8px; padding:10px 12px; margin-top:16px; }
  .steps { list-style:none; padding:0; margin:0; }
  .steps li { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .steps li:last-child { border-bottom:0; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--line); flex:none; transform:translateY(1px); }
  .s-running .dot { background:var(--accent); animation:pulse 1s infinite; }
  .s-ok .dot { background:var(--ok); } .s-error .dot { background:var(--critical); } .s-skipped .dot { background:#c3c9d1; }
  .steps .name { font-weight:600; min-width:270px; } .steps .msg { color:var(--muted); font-size:13px; word-break:break-word; }
  @keyframes pulse { 50% { opacity:.3; } }
  .score { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .score .num { font-size:44px; font-weight:700; line-height:1; }
  .pill { display:inline-block; color:#fff; border-radius:99px; padding:2px 10px; font-size:13px; font-weight:600; margin-right:4px; }
  .sev-critical{background:var(--critical)} .sev-high{background:var(--high)} .sev-medium{background:var(--medium)} .sev-low{background:var(--low)}
  pre.log { background:#0f172a; color:#e2e8f0; padding:10px; border-radius:8px; font-size:12px; max-height:220px; overflow:auto; white-space:pre-wrap; }
  @media (max-width:600px) { .steps li { flex-wrap:wrap; } .steps .name { min-width:0; } }
</style>
