<!--
================================================================================
 HANDOFF NOTES FOR MARCO
================================================================================
 One file, no build step. Open it in a browser: everything works on mock data.

 HOW IT IS ORGANISED (search for these markers):
   [CONFIG]   USE_MOCK switch + API base URL
   [CONTRACT] Exact JSON shapes the frontend expects from the backend
   [API]      The only place that talks to the backend. Each function has
              its REST endpoint in a comment + a mock implementation.
              To go live: set USE_MOCK = false and make the endpoints return
              the shapes in [CONTRACT]. No UI code needs to change.
   [SCORE]    Score rule (100 - 25/critical - 10/high - 3/medium, open only).
              Move it server-side later if you prefer; keep the same rule.
   [SCREENS]  One render function per screen.

 ROUTES (hash based):
   #/                         Start screen (quick audit from URL)
   #/deep                     Deep audit (ZIP or Git provider)
   #/scan/:auditId            Loading screen, polls audit status
   #/report/:auditId?view=    Report, view = founder | dev
   #/signup?next=...          Account gate (Fix / Download / Open PRs)
   #/app/dashboard            Logged-in platform
   #/app/fix/:auditId/:findingId
   #/app/passport/:auditId

 LOADING SCREEN: the sentences come from the backend as `events` in the
 status response. Send one event per meaningful step ("Checking who can read
 your database"), kind "alert" when something is found. The UI shows the
 latest one large and fades the older ones.
================================================================================

<script>
/* =============================================================================
   [CONFIG]
============================================================================= */
const CONFIG = {
  USE_MOCK: false,         // live backend
  API_BASE: '/api',        // e.g. 'http://localhost:8000/api'
  POLL_MS: 900,            // how often the scan / fix screens poll
  MAX_ZIP_MB: 50           // [X] MB on the deep audit screen
};

/* =============================================================================
   [CONTRACT]  Shapes the frontend expects. Keep field names identical.

   POST /audits  -> { audit_id: "a_123" }
     body (quick): { type: "quick", url: "https://..." }
     body (deep) : multipart { type: "deep", file: <zip> }  OR  { type: "deep", provider: "github" }

   GET /audits/:id/status -> {
     status: "running" | "done" | "failed",
     progress: 0-100,
     eta_seconds: 42,
     events: [ { text: "Checking who can read your database", kind: "info" | "alert" } ]   // oldest first
   }

   GET /audits/:id/report -> {
     audit_id, project: "our-crm", target: "https://our-crm.lovable.app", type: "quick" | "deep",
     scanned_at: "ISO date", commit: "abc1234" | null,
     findings: [ Finding ],
     ignored:  [ { rule_id, location, reason } ]          // AI-triage false positives
   }
   Finding = {
     id: "F1", severity: "critical" | "high" | "medium" | "low",
     title, impact, who_can_exploit,                       // founder-language fields
     rule_id, category, owasp, cwe, layer, confidence,     // developer fields
     file, line, technical_detail, summary,
     code: [ { n: 12, text: "create table ...", hit: true } ],
     proof: { confirmed: true, text: "..." },
     fix_status: "open" | "pr_created" | "merged" | "retesting" | "verified",
     pr_url: null
   }

   POST /audits/:id/findings/:fid/fix -> Fix
   GET  /fixes/:fixId                -> Fix
   Fix = {
     fix_id, finding_id, status: "pr_created" | "merged" | "retesting" | "verified" | "failed",
     plain_change: "We lock the contacts table...", reassurance: "Nothing changes for your users...",
     file: "supabase/migrations/002_fix_contacts.sql",
     diff: [ "+ alter table contacts enable row level security;" ],
     checks: [ { label: "The app builds and starts", passed: true } ],
     pr_url: "https://github.com/..."
   }

   POST /auth/signup  { method: "github" | "google" | "email", email?, password? } -> { user: { id, name, email } }
   GET  /projects -> [ { id, name, stack, score, counts: {critical,high,medium,low}, last_audit, status, audit_id } ]
============================================================================= */

/* =============================================================================
   [SCORE]
============================================================================= */
const WEIGHTS = { critical: 25, high: 10, medium: 3, low: 0 };
function openFindings(report) { return report.findings.filter(f => f.fix_status !== 'verified'); }
function computeScore(report) {
  const lost = openFindings(report).reduce((s, f) => s + (WEIGHTS[f.severity] || 0), 0);
  return Math.max(0, 100 - lost);
}
function counts(list) {
  const c = { critical: 0, high: 0, medium: 0, low: 0 };
  list.forEach(f => { c[f.severity] = (c[f.severity] || 0) + 1; });
  return c;
}

const mock = { audits: {}, fixes: {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function http(method, path, body, isForm) {
  const res = await fetch(CONFIG.API_BASE + path, {
    method,
    headers: isForm ? undefined : { 'Content-Type': 'application/json' },
    body: body ? (isForm ? body : JSON.stringify(body)) : undefined,
    credentials: 'include'
  });
  if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
  return res.json();
}

const api = {
  // POST /audits
  async startAudit(payload) {
    if (!CONFIG.USE_MOCK) {
      if (payload.file) {
        const fd = new FormData(); fd.append('type', 'deep'); fd.append('file', payload.file);
        return http('POST', '/audits', fd, true);
      }
      return http('POST', '/audits', payload);
    }
    await sleep(300);
    const id = 'a_' + Math.random().toString(36).slice(2, 8);
    mock.audits[id] = { started: Date.now(), duration: payload.type === 'deep' ? 26000 : 14000, type: payload.type, target: payload.url || payload.provider || 'upload.zip' };
    return { audit_id: id };
  },

  // GET /audits/:id/status
  async getAuditStatus(id) {
    if (!CONFIG.USE_MOCK) return http('GET', '/audits/' + id + '/status');
    const a = mock.audits[id] || (mock.audits[id] = { started: Date.now(), duration: 14000, type: 'quick' });
    const t = Math.min(1, (Date.now() - a.started) / a.duration);
    const shown = Math.max(1, Math.ceil(t * MOCK_EVENTS.length));
    return {
      status: t >= 1 ? 'done' : 'running',
      progress: Math.round(t * 100),
      eta_seconds: Math.round((1 - t) * a.duration / 1000),
      events: MOCK_EVENTS.slice(0, shown)
    };
  },

  // GET /audits/:id/report
  async getReport(id) {
    if (!CONFIG.USE_MOCK) return http('GET', '/audits/' + id + '/report');
    if (!mock.audits[id] || !mock.audits[id].report) {
      const a = mock.audits[id] || (mock.audits[id] = {});
      a.report = JSON.parse(JSON.stringify(MOCK_REPORT));
      a.report.audit_id = id;
      if (a.type) a.report.type = a.type;
      if (a.type === 'deep') a.report.commit = 'a1b2c3d';
    }
    return mock.audits[id].report;
  },

  // POST /audits/:id/findings/:fid/fix
  async createFix(auditId, findingId) {
    if (!CONFIG.USE_MOCK) return http('POST', '/audits/' + auditId + '/findings/' + findingId + '/fix');
    const report = await api.getReport(auditId);
    const f = report.findings.find(x => x.id === findingId);
    const base = MOCK_FIXES[findingId] || defaultFix(f);
    const fixId = 'fx_' + auditId + '_' + findingId;
    if (!mock.fixes[fixId]) mock.fixes[fixId] = { created: Date.now(), auditId, findingId, base };
    return api.getFix(fixId);
  },

  // GET /fixes/:fixId
  async getFix(fixId) {
    if (!CONFIG.USE_MOCK) return http('GET', '/fixes/' + fixId);
    const m = mock.fixes[fixId];
    const el = Date.now() - m.created;
    const status = el < 4000 ? 'pr_created' : el < 6000 ? 'merged' : el < 10000 ? 'retesting' : 'verified';
    const report = await api.getReport(m.auditId);
    const f = report.findings.find(x => x.id === m.findingId);
    f.fix_status = status;
    f.pr_url = 'https://github.com/our-team/our-crm/pull/' + (12 + Number(m.findingId.slice(1)));
    return {
      fix_id: fixId, finding_id: m.findingId, status,
      plain_change: m.base.plain_change, reassurance: m.base.reassurance, file: m.base.file, diff: m.base.diff,
      checks: m.base.checks.map(label => ({ label, passed: true })),
      pr_url: f.pr_url
    };
  },

  // POST /auth/signup
  async signup(payload) {
    if (!CONFIG.USE_MOCK) return http('POST', '/auth/signup', payload);
    await sleep(400);
    return { user: { id: 'u1', name: payload.email ? payload.email.split('@')[0] : 'Founder', email: payload.email || null } };
  },

  // GET /projects
  async listProjects() {
    if (!CONFIG.USE_MOCK) return http('GET', '/projects');
    const auditId = state.lastAuditId || 'demo';
    const report = await api.getReport(auditId);
    return MOCK_PROJECTS.map(p => {
      if (!p.live) return p;
      const c = counts(openFindings(report));
      const score = computeScore(report);
      return Object.assign({}, p, { audit_id: auditId, score, counts: c, status: score >= 80 ? 'Healthy' : 'Action needed' });
    });
  }
};

function clearTimers() { state.timers.forEach(t => clearInterval(t)); state.timers = []; }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function parseRoute() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, query] = raw.split('?');
  const params = new URLSearchParams(query || '');
  return { parts: path.split('/').filter(Boolean), params };
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const $app = document.getElementById('app');

async function render() {
  clearTimers();
  window.scrollTo(0, 0);
  const { parts, params } = parseRoute();
  try {
    if (parts.length === 0) return screenStart();
    if (parts[0] === 'deep') return screenDeep();
    if (parts[0] === 'scan') return screenScan(parts[1]);
    if (parts[0] === 'report') return screenReport(parts[1], params.get('view'));
    if (parts[0] === 'signup') return screenSignup(params.get('next'));
    if (parts[0] === 'app') {
      if (!state.user) return go('#/signup?next=' + encodeURIComponent(location.hash));
      if (parts[1] === 'dashboard') return screenDashboard();
      if (parts[1] === 'fix') return screenFix(parts[2], parts[3]);
      if (parts[1] === 'passport') return screenPassport(parts[2]);
    }
    $app.innerHTML = '<div class="wrap"><h1>Page not found</h1><a class="btn btn-dark" href="#/">Back to start</a></div>';
  } catch (e) {
    console.error(e);
    $app.innerHTML = '<div class="wrap"><h1>Something failed</h1><p>' + esc(e.message) + '</p><a class="btn btn-dark" href="#/">Back to start</a></div>';
  }
}

/* 2 · Scan in progress (polls status, shows backend events as sentences) */
function screenScan(id) {
  $app.innerHTML = `<header class="pub-head"><a class="logo" href="#/">LOGO</a><span class="small" style="font-family:var(--mono);font-size:14px">${esc((mock.audits[id] && mock.audits[id].target) || 'your app')}</span></header>
  <main class="scan">
    <div class="now" aria-live="polite"><span class="pulse">${ICON_SHIELD}</span><p class="shimmer" id="now">Starting the technical audit…</p></div>
    <div><div class="bar" role="progressbar" aria-label="Audit progress" aria-valuemin="0" aria-valuemax="100" id="bar"><div id="fill"></div></div>
      <div class="bar-meta"><span id="pct">0%</span><span id="eta"></span></div></div>
    <ol class="history" id="hist"></ol>
  </main>
  <p class="small" style="text-align:center;padding:0 24px 40px">Your report opens automatically when the audit is done.</p>`;
  const nowEl = document.getElementById('now'), fill = document.getElementById('fill'), bar = document.getElementById('bar'),
        pct = document.getElementById('pct'), eta = document.getElementById('eta'), hist = document.getElementById('hist');
  let lastCount = 0;
  async function tick() {
    let s;
    try { s = await api.getAuditStatus(id); } catch (e) { nowEl.textContent = 'Connection lost. Retrying…'; return; }
    if (s.status === 'failed') { clearTimers(); nowEl.classList.remove('shimmer'); nowEl.textContent = 'The audit stopped. Check that your app is online and try again.'; return; }
    fill.style.width = s.progress + '%'; bar.setAttribute('aria-valuenow', s.progress);
    pct.textContent = s.progress + '%';
    eta.textContent = s.status === 'done' ? 'Done' : (s.eta_seconds < 10 ? 'Almost done' : 'About ' + s.eta_seconds + ' seconds left');
    const ev = s.events || [];
    if (ev.length !== lastCount) {
      lastCount = ev.length;
      const cur = ev[ev.length - 1];
      nowEl.textContent = s.status === 'done' ? 'Audit complete. Opening your report…' : cur.text;
      const past = (s.status === 'done' ? ev : ev.slice(0, -1)).slice(-5).reverse();
      hist.innerHTML = past.map((e, i) => `<li class="${e.kind === 'alert' ? 'alert' : ''}" style="opacity:${Math.max(.25, .85 - i * .16).toFixed(2)}"><span class="mk">${e.kind === 'alert' ? '!' : '✓'}</span>${esc(e.text)}</li>`).join('');
    }
    if (s.status === 'done') { clearTimers(); setTimeout(() => go('#/report/' + id), 1200); }
  }
  tick();
  state.timers.push(setInterval(tick, CONFIG.POLL_MS));
}

    done({ method: 'email', email: em, password: pw });

            <td><span class="pill-score" style="background:${t[0]};color:${t[1]}">${p.score}</span></td><td><div class="chips">${iss}</div></td><td class="small" style="font-size:15px">${esc(p.last_audit)}</td><td style="color:${t[1]};font-weight:600;font-size:13px">${esc(p.status)}</td></tr>`; }).join('')}
        </tbody></table></div></section>
      <section class="card side-col" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px">Next best actions</h2>
        ${firstOpen ? `<div class="action urgent"><strong>Fix ${openFindings(liveReport).length} open issue${openFindings(liveReport).length > 1 ? 's' : ''} on ${esc(live.name)}</strong><span>Start with: ${esc(firstOpen.title.toLowerCase())}.</span><a class="btn btn-dark" style="align-self:flex-start;min-height:40px;font-size:14px" href="#/app/fix/${live.audit_id}/${firstOpen.id}">Start fixing</a></div>`
          : `<div class="action"><strong>Share the passport of ${esc(live.name)}</strong><span>All issues are fixed and verified.</span><a class="btn btn-dark" style="align-self:flex-start;min-height:40px;font-size:14px" href="#/app/passport/${live.audit_id}">Open passport</a></div>`}
        <div class="action"><strong>Re-scan client-portal</strong><span>12 new commits since the last audit.</span></div>
        <div class="action"><strong>Turn on automatic re-scans</strong><span>Audit every new version before it goes live.</span></div>
      </section></div>
    <section class="card"><h2 style="margin:0 0 8px;font-size:18px">Recent activity</h2><ol class="activity">
      <li><span>${liveReport.type === 'deep' ? 'Deep' : 'Quick'} audit of ${esc(live.name)} finished: ${liveReport.findings.length} issues found</span><span>Today</span></li>
      ${verifiedCount ? `<li><span>${verifiedCount} fix${verifiedCount > 1 ? 'es' : ''} verified on ${esc(live.name)}</span><span>Today</span></li>` : ''}
      <li><span>Account created</span><span>Today</span></li>
      <li><span>Security passport of sales-landing shared with [prospect]</span><span>3 days ago</span></li></ol></section>`;
  $app.innerHTML = shell('dashboard', inner);
}

/* 6 · Fix a finding (creates fix, polls status) */
async function screenFix(auditId, findingId) {
  state.lastAuditId = auditId;
  const report = await api.getReport(auditId);
  const f = report.findings.find(x => x.id === findingId);
  if (!f) { $app.innerHTML = shell('fixes', '<h1>Finding not found</h1>'); return; }
  const before = computeScore(report);
  const steps = [['pr_created', 'Fix proposed on GitHub'], ['merged', 'Approved and merged by you'], ['retesting', 'Re-testing the attack'], ['verified', 'Fixed and verified']];
  const others = openFindings(report).filter(x => x.id !== f.id);
  $app.innerHTML = shell('fixes', `<a href="#/report/${auditId}" class="small" style="font-size:15px;text-decoration:none;min-height:44px;display:flex;align-items:center">← Back to the report</a>
    <div style="display:flex;flex-direction:column;gap:10px"><div class="chips">${sevChip(f.severity)}<span class="cat">${esc(f.category)} · ${esc(f.owasp)}</span></div><h1 style="margin:0;font-size:30px;line-height:1.2">${esc(f.title)}</h1></div>
    <div class="two"><div class="grow" style="display:flex;flex-direction:column;gap:20px" id="fixBody"><div class="card"><p class="small">Preparing the fix…</p></div></div>
      <aside class="card side-col" style="display:flex;flex-direction:column;gap:18px"><h2 style="margin:0;font-size:18px">Fix status</h2>
        <ol class="timeline" id="tl">${steps.map(([k, l]) => `<li data-step="${k}"><span class="dot"></span>${l}</li>`).join('')}</ol>
        <a class="btn btn-line" id="pr" href="#" target="_blank" rel="noopener" hidden>View the pull request</a>
        <div style="border-top:1px solid var(--line-2);padding-top:16px;display:flex;flex-direction:column;gap:8px"><span class="small">When verified, your score becomes</span>
          <div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:22px;font-weight:700;color:var(--crit)">${before}</span><span class="small">→</span><span style="font-size:30px;font-weight:700;color:var(--ok)">${Math.min(100, before + (WEIGHTS[f.severity] || 0))}</span></div></div>
        <div id="nextBox"></div>
      </aside></div>`);
  let fix;
  try { fix = await api.createFix(auditId, findingId); } catch (e) { document.getElementById('fixBody').innerHTML = '<div class="card"><p class="err" style="padding:0">The fix could not be created: ' + esc(e.message) + '</p></div>'; return; }
  document.getElementById('fixBody').innerHTML = `
    <section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px">What we will change</h2><p style="margin:0;font-size:16px;line-height:1.55">${esc(fix.plain_change)}</p><p class="small" style="font-size:15px">${esc(fix.reassurance)}</p></section>
    <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="sec-head"><h2 style="font-size:18px">The code change</h2><span class="cat" style="font-size:13px">${esc(fix.file)}</span></div>
      <div class="code diff" id="diff" hidden>${fix.diff.map(l => `<div>${esc(l)}</div>`).join('')}</div>
      <button class="linkbtn" type="button" id="toggleDiff" aria-expanded="false" aria-controls="diff" style="align-self:flex-start">Show code</button></section>
    <section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px">Safety checks: does your app still work?</h2>
      <div class="checks">${fix.checks.map(c => `<div>${c.passed ? ICON_CHECK : '<span style="color:var(--crit);font-weight:700">!</span>'}${esc(c.label)}</div>`).join('')}</div></section>
    <div id="verifiedBox"></div>`;
  document.getElementById('toggleDiff').addEventListener('click', (e) => { const d = document.getElementById('diff'); d.hidden = !d.hidden; e.target.setAttribute('aria-expanded', !d.hidden); e.target.textContent = d.hidden ? 'Show code' : 'Hide code'; });
  const pr = document.getElementById('pr');
  function paint(fx) {
    const idx = steps.findIndex(s => s[0] === fx.status);
    document.querySelectorAll('#tl li').forEach((li, i) => { li.className = i < idx || fx.status === 'verified' ? 'done' : i === idx ? 'cur' : ''; });
    if (fx.pr_url) { pr.href = fx.pr_url; pr.hidden = false; }
    if (fx.status === 'verified') {
      clearTimers();
      document.getElementById('verifiedBox').innerHTML = `<div class="verified">${ICON_CHECK}Fixed and verified: the original attack no longer works.</div>`;
      const nxt = others[0];
      document.getElementById('nextBox').innerHTML = nxt ? `<a class="btn btn-dark" href="#/app/fix/${auditId}/${nxt.id}">Fix the next issue</a>` : `<a class="btn btn-dark" href="#/app/passport/${auditId}">See your security passport</a>`;
    }
  }
  paint(fix);
  if (fix.status !== 'verified') state.timers.push(setInterval(async () => { try { paint(await api.getFix(fix.fix_id)); } catch (e) {} }, CONFIG.POLL_MS));
}

/* 7 · Security passport */
async function screenPassport(auditId) {
  state.lastAuditId = auditId;
  const r = await api.getReport(auditId);
  const initial = Math.max(0, 100 - r.findings.reduce((s, f) => s + (WEIGHTS[f.severity] || 0), 0));
  const score = computeScore(r), fixed = r.findings.filter(f => f.fix_status === 'verified'), open = openFindings(r);
  const order = { critical: 0, high: 1, medium: 2, low: 3 };
  $app.innerHTML = shell('passport', `<div class="main-head"><div><h1>Security passport</h1><p>Share it with a client, a prospect or an investor.</p></div>
      <div class="actions"><button class="btn btn-line" id="share" type="button">Copy share link</button><button class="btn btn-dark" id="pdf" type="button">Download PDF</button></div></div>
    <article class="card passport" id="pp">
      <div class="pp-head"><div><p class="small" style="margin:0;font-size:14px">Security passport</p><h1>${esc(r.project)}</h1><p class="small" style="margin:0;font-size:15px">Audited on ${fmtDate(r.scanned_at)} · Reference: OWASP Top 10, selected checks${r.commit ? ' · commit ' + esc(r.commit) : ''}</p></div>${ring(score, 120)}</div>
      <div class="kpis">
        <div class="box"><span>Score</span><strong><span style="color:var(--crit)">${initial}</span> → <span style="color:${scoreTone(score)[1]}">${score}</span></strong></div>
        <div class="box"><span>Issues found</span><strong>${r.findings.length}</strong></div>
        <div class="box"><span>Fixed and verified</span><strong style="color:var(--ok)">${fixed.length}</strong></div>
        <div class="box"><span>Still open</span><strong style="color:${open.length ? 'var(--med)' : 'var(--ok)'}">${open.length}</strong></div>
      </div>
      <section style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px">Detail of checks</h2>
        <div class="tbl" style="border:1px solid #E4E3DD;border-radius:10px"><table><thead><tr style="background:#F7F6F2"><th>Issue</th><th>Severity</th><th>Status</th></tr></thead><tbody>
        ${r.findings.slice().sort((a, b) => order[a.severity] - order[b.severity]).map(f => `<tr><td>${esc(f.title)}</td><td style="font-weight:600;color:var(--${f.severity === 'critical' ? 'crit' : f.severity === 'high' ? 'high' : 'med'})">${SEV_LABEL[f.severity]}</td>
          <td style="font-weight:600;color:${f.fix_status === 'verified' ? 'var(--ok)' : 'var(--muted)'}">${f.fix_status === 'verified' ? 'Fixed · verified ' + fmtDate(new Date().toISOString()) : 'Open'}</td></tr>`).join('')}
        </tbody></table></div></section>
      <section><h2 style="margin:0 0 8px;font-size:18px">How to read this</h2><p class="small" style="font-size:15px;margin:0">Each fixed issue was re-tested after the fix: the original attack no longer works. The score starts at 100 and loses 25 points per critical, 10 per high and 3 per medium issue still open.</p></section>
      <p class="disclaimer">Audit performed on ${fmtDate(r.scanned_at)} against a selection of OWASP Top 10 checks. This report describes the state of the project at that date. It is not a guarantee of security and not a certification.</p>
    </article>`);
  document.getElementById('share').addEventListener('click', async () => {
    // TODO(backend): create a public read-only passport URL, e.g. POST /audits/:id/passport/share -> { url }
    const url = location.origin + location.pathname + '#/app/passport/' + auditId;
    try { await navigator.clipboard.writeText(url); toast('Share link copied'); } catch (e) { toast(url); }
  });
  // TODO(backend): replace with a server-generated PDF. window.print() is a stand-in.
  document.getElementById('pdf').addEventListener('click', () => window.print());
}

render();
</script>
</body>
</html>
