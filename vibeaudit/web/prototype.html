<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syberia · Security audit for vibe-coded apps</title>
<!--
================================================================================
 SYBERIA · HANDOFF NOTES FOR MARCO  (v2, premium design)
================================================================================
 One file, no build step. Open it in a browser: the whole flow works on mock data.

 WHAT CHANGED SINCE v1
   - New design (liquid glass, white/grey + green/lime, Fraunces + Figtree)
   - Home and report pages have no menu bar (focus on the audit)
   - Score explanation panel ("?" next to the score)
   - Onboarding questionnaire (4 steps) after sign-up   -> POST /me/onboarding
   - Platform pages: Dashboard, Projects, Findings, Fixes, Passport
   - Fixes are now a BATCH: select several findings, fix them in one run,
     then propose targeted edits in a GitHub PR

 HOW IT IS ORGANISED (search for these markers)
   [CONFIG]   USE_MOCK switch + API base URL
   [CONTRACT] Exact JSON shapes the frontend expects. Keep field names.
   [API]      The only place that talks to the backend (REST endpoint in a
              comment above each function + a mock implementation).
              To go live: USE_MOCK = false, make endpoints return [CONTRACT].
   [SCORE]    Score rule (100 - 25/critical - 10/high - 3/medium, open only).
   [SCREENS]  One render function per screen.

 ROUTES (hash based)
   #/                                Home (quick audit from URL)
   #/deep                            Deep audit (ZIP or Git provider)
   #/scan/:auditId                   Loading screen, polls audit status
   #/report/:auditId?view=           Public report, view = founder | dev
   #/signup?next=                    Account gate
   #/onboarding?next=                4-step questionnaire after sign-up
   #/app/dashboard                   Platform home
   #/app/projects
   #/app/findings?project=&sev=
   #/app/fixes/:projectId?select=F1,F2
   #/app/passport/:projectId
================================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300..500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16301F; --ink-2:#1F2E25; --text-2:#3B4A41; --muted:#526058; --faint:#5F6E65;
  --link:#2F6B45; --ground-top:#F3F5F6; --ground-bottom:#E9EEF0;
  --crit:#B42230; --crit-bg:rgba(255,95,109,.14); --crit-rail:linear-gradient(180deg,#FF5F6D,#FFB25B);
  --high:#A65200; --high-bg:rgba(255,165,60,.16); --high-rail:linear-gradient(180deg,#FFA53C,#FFD27A);
  --med:#725C00;  --med-bg:rgba(225,195,40,.2);   --med-rail:linear-gradient(180deg,#E1C328,#F2E38A);
  --ok:#3C6A0E;
  --lime:linear-gradient(135deg,#D8F65E,#F5FCCD);
  --mint:linear-gradient(135deg,rgba(148,203,170,.95),rgba(236,247,218,.95));
  --green-card:radial-gradient(90% 90% at 100% 0%, rgba(226,249,120,.95) 0%, rgba(226,249,120,0) 58%), linear-gradient(155deg, rgba(214,238,222,.95) 0%, rgba(160,212,180,.9) 100%);
  --sans:'Figtree',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--ground-top),var(--ground-bottom));-webkit-font-smoothing:antialiased}
a{color:var(--ink)} a:hover{color:var(--link)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.serif{font-family:var(--serif);font-weight:400;font-optical-sizing:auto;letter-spacing:-.02em}
.mono{font-family:var(--mono)}

/* background light */
.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.85;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,-30px) scale(1.1)}}
#app{position:relative;z-index:1;min-height:100vh}

/* glass */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.38));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(22,48,31,.04),0 24px 50px -30px rgba(40,70,50,.35)}
.glass-soft{background:rgba(255,255,255,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8)}
.lift{transition:transform .6s cubic-bezier(.3,1.5,.5,1),box-shadow .4s ease}
.lift:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 #fff,0 32px 60px -30px rgba(40,70,50,.45)}

/* buttons: subtle micro-animation */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.85);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .3s ease}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 55%);opacity:.5;transition:opacity .35s ease}
.btn::before{content:"";position:absolute;inset:0;z-index:-2;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 8px rgba(196,238,90,0);transition:box-shadow .6s ease-out}
.btn:hover{transform:translateY(-1px);color:var(--ink)}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.975);transition-duration:.12s}
.btn:active::before{box-shadow:0 0 0 0 rgba(196,238,90,.65);transition:0s}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-lime{background:var(--lime);box-shadow:0 12px 26px -14px rgba(150,200,40,.85),inset 0 1px 0 rgba(255,255,255,.9)}
.btn-mint{background:var(--mint);box-shadow:0 10px 24px -14px rgba(50,110,70,.6),inset 0 1px 0 rgba(255,255,255,.9)}
.btn-lg{min-height:56px;padding:0 28px;font-size:17px}
.btn-sm{min-height:40px;padding:0 16px;font-size:13px}
.btn-icon{width:38px;min-height:38px;padding:0;border-radius:50%}
.linkbtn{background:none;border:none;padding:0;min-height:44px;font-weight:600;font-size:14px;text-decoration:underline;cursor:pointer;color:var(--ink)}
.orb{display:inline-block;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#F3FFC4 24%,#A9DDB8 62%,#3F8A5D 100%);box-shadow:0 10px 24px -8px rgba(63,138,93,.55),inset 0 -6px 12px rgba(30,90,50,.25)}
.orb-live{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.flow{background:linear-gradient(90deg,#9FD8B1,#DDF77A,#9FD8B1);background-size:200% 100%;animation:flow 1.8s linear infinite}
@keyframes flow{0%{background-position:0 0}100%{background-position:-200% 0}}
.shimmer{background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 36%,#A9C9B2 50%,var(--ink) 64%,var(--ink) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.blob,.orb-live,.flow,.shimmer{animation:none}.shimmer{color:var(--ink);background:none}.btn,.lift,.btn::before{transition:none}}

/* common bits */
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:20px;text-decoration:none;color:var(--ink)}
.top-center{display:flex;justify-content:center;padding:32px 24px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600}
.sev-critical{background:var(--crit-bg);color:var(--crit)}
.sev-high{background:var(--high-bg);color:var(--high)}
.sev-medium{background:var(--med-bg);color:var(--med)}
.sev-low{background:rgba(22,48,31,.06);color:var(--text-2)}
.sev-fixed{background:var(--lime);color:var(--ink)}
.tag{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12px;font-family:var(--mono)}
.muted{color:var(--muted)}
.err{color:var(--crit);font-size:14px;min-height:20px}
.card{border-radius:28px;padding:22px}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:12px}
.h1{margin:0;font-size:clamp(40px,5vw,56px);line-height:1}
.h2{margin:0;font-size:18px;font-weight:600}
.eyebrow{margin:0;font-size:15px;color:var(--faint)}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.seg{display:flex;gap:4px;padding:5px;border-radius:999px}
.seg .btn{min-height:40px;font-size:14px;font-weight:500;border-color:transparent;background:transparent;backdrop-filter:none}
.seg .btn[aria-pressed="true"],.seg .btn[aria-current="page"]{background:var(--mint);border-color:rgba(255,255,255,.85);font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:600}
.input{height:52px;padding:0 20px;border:1px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(255,255,255,.6);font-size:15px}
.or{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--faint)}
.or::before,.or::after{content:"";flex:1 1 auto;height:1px;background:rgba(22,48,31,.1)}
.divider{border-top:1px solid rgba(22,48,31,.07)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:999px;font-size:14px;z-index:20}

/* home */
.home{max-width:1040px;margin:0 auto;padding:56px 24px 72px;display:flex;flex-direction:column;gap:36px}
.home h1{margin:0;font-size:clamp(44px,7vw,84px);line-height:.98;text-align:center;max-width:900px;align-self:center}
.url-bar{border-radius:999px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;max-width:780px;width:100%;margin:0 auto}
.url-bar input{flex:999 1 280px;min-width:0;height:60px;padding:0 26px;border:none;border-radius:999px;background:rgba(255,255,255,.65);font-size:18px}
.url-bar .btn{flex:1 1 220px;height:60px}
.mode{flex:1 1 320px;border-radius:32px;padding:30px;display:flex;flex-direction:column;gap:16px}
.mode-green{background:var(--green-card);box-shadow:0 30px 60px -30px rgba(60,120,70,.4),inset 0 1px 0 rgba(255,255,255,.6)}

/* dialog pages */
.dialog-wrap{display:flex;justify-content:center;padding:56px 20px 64px}
.dialog{width:100%;max-width:600px;border-radius:36px;padding:34px;display:flex;flex-direction:column;gap:20px}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:200px;border-radius:28px;border:1.5px dashed rgba(22,48,31,.22);text-align:center;padding:24px;cursor:pointer}
.drop.over{background:rgba(216,246,94,.25);border-color:var(--link)}

/* scan */
.scan{max-width:760px;margin:0 auto;padding:48px 24px 64px;display:flex;flex-direction:column;align-items:center;gap:36px}
.bar{height:12px;border-radius:999px;background:rgba(22,48,31,.07);box-shadow:inset 0 1px 2px rgba(22,48,31,.08);overflow:hidden}
.bar>div{height:100%;width:0;border-radius:999px;transition:width .4s linear;box-shadow:0 0 14px rgba(150,205,90,.55)}
.bar.done>div{background:linear-gradient(90deg,#D9FF6E,#9BD52A);animation:none}
.history{width:100%;margin:0;padding:0 12px;list-style:none;display:flex;flex-direction:column;gap:12px}
.history li{display:flex;align-items:center;font-size:16px;line-height:1.4;color:#26352C}
.history li.alert{color:#8A1F24}
.mk{display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px;height:24px;margin-right:12px;border-radius:50%;font-size:13px;font-weight:700;background:rgba(150,210,50,.22);color:var(--ok)}
.alert .mk{background:rgba(255,90,95,.16);color:#C42B30}

/* report */
.wrap{max-width:1000px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:24px}
.wrap.wide{max-width:1240px}
.score-card{border-radius:36px;padding:32px;display:flex;flex-wrap:wrap;gap:36px;align-items:center}
.ring{position:relative;flex:0 0 auto}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .q{position:absolute;top:4px;right:4px}
.finding{border-radius:28px;padding:24px 26px;display:flex;gap:20px}
.rail{flex:0 0 6px;align-self:stretch;border-radius:999px}
.rail-critical{background:var(--crit-rail)} .rail-high{background:var(--high-rail)} .rail-medium{background:var(--med-rail)} .rail-low{background:rgba(22,48,31,.15)} .rail-fixed{background:linear-gradient(180deg,#D9FF6E,#9BD52A)}
.f-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
.f-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.f-title{display:flex;flex-direction:column;gap:8px;flex:1 1 380px}
.f-title h3{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.code{border-radius:16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.8;background:rgba(22,48,31,.04);border:1px solid rgba(255,255,255,.7)}
.code div{white-space:pre;padding:0 14px}
.code div.hit{background:rgba(255,95,109,.14);box-shadow:inset 3px 0 0 #FF5F6D}
.code .ln{display:inline-block;width:36px;color:#8A90A0;text-align:right;margin-right:14px}
.proof{font-size:13px;line-height:1.5;padding:8px 12px;border-radius:12px;background:rgba(22,48,31,.05);color:var(--text-2)}
.proof.ok{background:linear-gradient(135deg,rgba(238,255,158,.8),rgba(200,242,74,.6));color:var(--ink)}
.calc-line{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:16px;font-size:15px}
.filters{flex:1 1 230px;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:20px}
.filters fieldset{margin:0;padding:0;border:none;display:flex;flex-direction:column;gap:4px}
.filters legend{padding:0;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--faint)}
.filters label{display:flex;align-items:center;gap:10px;min-height:32px;font-size:14px}
.filters input,.check{width:18px;height:18px;margin:0;accent-color:var(--link)}

/* platform */
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh}
.side{flex:1 1 230px;max-width:100%;margin:20px 0 20px 20px;border-radius:28px;padding:22px 14px;display:flex;flex-direction:column;gap:26px;align-self:flex-start;position:sticky;top:20px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border-radius:14px;text-decoration:none;font-size:15px;color:var(--text-2);border:1px solid transparent;transition:background .3s ease}
.side nav a:hover{background:rgba(255,255,255,.5)}
.side nav a[aria-current="page"]{background:var(--mint);border-color:rgba(255,255,255,.85);color:var(--ink);font-weight:600}
.side .n{font-size:12px;color:var(--faint)}
.main{flex:999 1 640px;min-width:0;padding:32px 32px 56px;display:flex;flex-direction:column;gap:22px}
.kpi{flex:1 1 160px;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:13px;color:var(--faint)}
.kpi strong{font-size:48px;line-height:1}
.action{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 4px}
.action .chip{flex:0 0 76px;justify-content:center}
.insight{position:relative;overflow:hidden;border-radius:30px;padding:26px;min-height:300px;display:flex;flex-direction:column;gap:12px;background:var(--green-card);box-shadow:0 30px 60px -30px rgba(60,120,70,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--faint);font-weight:500;padding:10px 8px;white-space:nowrap}
td{padding:14px 8px;border-top:1px solid rgba(22,48,31,.07);vertical-align:middle}
td.num,th.num{text-align:right}
.num a{text-decoration:none;font-weight:500;color:var(--link)}
.num a.zero{color:#8A968E}
.pill-score{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:30px;padding:0 8px;border-radius:999px;font-family:var(--serif);font-size:17px}
.status-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700}
.fix-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 18px;border-radius:22px}
.fix-row.dim{opacity:.45}
.prog{flex:0 1 300px;min-width:200px;display:flex;flex-direction:column;gap:8px}
.prog .bar{height:10px}
.deploy{flex:1 1 280px;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:88px;padding:18px 22px;text-align:left;border-radius:24px;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 14px 30px -24px rgba(28,36,80,.4)}
.opt[aria-pressed="true"]{background:linear-gradient(135deg,rgba(238,255,158,.95),rgba(200,242,74,.85));box-shadow:0 16px 34px -18px rgba(140,190,30,.9),inset 0 1px 0 rgba(255,255,255,.9)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){
  .opts{grid-template-columns:1fr}
  .side{margin:12px;position:static}
  .main{padding:20px 16px 40px}
  .score-card,.dialog{padding:24px}
}
@media print{.blobs,.side,.no-print{display:none!important}.glass{box-shadow:none;backdrop-filter:none}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true">
  <div class="blob" style="width:560px;height:560px;left:-140px;top:-180px;background:#CDEBD7"></div>
  <div class="blob" style="width:480px;height:480px;right:-120px;top:140px;background:#DCE4EA;animation-delay:-6s"></div>
  <div class="blob" style="width:460px;height:460px;left:32%;bottom:-200px;background:#EDF9B4;animation-delay:-10s"></div>
  <div class="blob" style="width:320px;height:320px;right:16%;bottom:8%;background:#BFE5CC;opacity:.6;animation-delay:-3s"></div>
</div>
<div id="app"></div>

<script>
/* =============================================================================
   [CONFIG]
============================================================================= */
const CONFIG = {
  USE_MOCK: false,         // backend branché (vibeaudit)
  API_BASE: '/api',        // e.g. 'http://localhost:8000/api'
  POLL_MS: 900,            // polling interval for scan and fix screens
  MAX_ZIP_MB: 50
};

/* =============================================================================
   [CONTRACT]  Shapes the frontend expects. Keep field names identical.

   POST /audits -> { audit_id }
     quick: { type: "quick", url }
     deep : multipart { type: "deep", file: <zip> }  OR  { type: "deep", provider: "github", repo_url }

   GET /audits/:id/status -> {
     status: "running" | "done" | "failed", progress: 0-100, eta_seconds,
     events: [ { text: "Checking who can read your database", kind: "info" | "alert" } ]   // oldest first
   }

   GET /audits/:id/report -> {
     audit_id, project_id: "our-crm", project, target, type: "quick" | "deep", scanned_at, commit | null,
     findings: [ Finding ], ignored: [ { rule_id, location, reason } ]
   }
   Finding = {
     id, project_id, severity: "critical" | "high" | "medium" | "low",
     group: "code" | "supply_chain" | "workflow",                 // drives the Projects table columns
     title, impact, who_can_exploit,                               // founder language
     rule_id, category, owasp, cwe, layer, confidence, file, line, technical_detail, summary,
     code: [ { n, text, hit? } ], proof: { confirmed, text },
     fix_status: "open" until a later audit confirms the issue is resolved, found_at
   }

   GET /auth/github/login -> GitHub OAuth sign-in (the only sign-in method)
   POST /me/onboarding { role, built_with, goal, concerns: [] }   -> { ok: true }
     role: founder | dev | agency | other   (dev => developer view by default)

   GET /projects -> [ Project ]
   Project = { id, name, repo, provider: "github", stack, last_scan_at_label, last_scan_ok, audit_id,
               scanned_dependencies, workflow_issues, tags: [], fixes_verified, commits_since_scan }
   (score and finding counts are computed in the UI from /findings, see [SCORE])

   GET /findings?project=&severity= -> [ Finding ]                 // all projects of the user
   POST /projects/:id/rescan -> { audit_id }

   POST /fixes/batches { project_id, finding_ids: [] } -> { batch_id }
   GET  /fixes/batches/:id -> {
     status: "running" | "done" | "failed",
     items: [ { finding_id, progress: 0, stage: "ready" } ]  // selection only; edits start on explicit GitHub action
   }
   POST /fixes/batches/:id/deploy { target: "github" } -> { pr_url, patched_files, recommendation_count, verification }

   POST /passports/:projectId/share -> { url }                      // public read-only link
   GET  /passports/:projectId/pdf   -> application/pdf
============================================================================= */

/* =============================================================================
   [SCORE]
============================================================================= */
const WEIGHTS = { critical: 25, high: 10, medium: 3, low: 1 };
const SCORE_CATEGORY_CAP = 40;
const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
const SEV_LABEL = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };
const isOpen = f => f.fix_status !== 'verified';
function computeScore(findings) {
  const byCategory = {};
  findings.filter(isOpen).forEach(f => {
    const category = f.category || 'other';
    byCategory[category] = (byCategory[category] || 0) + (WEIGHTS[f.severity] || 0);
  });
  return Math.max(0, 100 - Object.values(byCategory).reduce((sum, points) => sum + Math.min(SCORE_CATEGORY_CAP, points), 0));
}
function initialScore(findings) {
  return computeScore(findings);
}
function counts(list) {
  const c = { critical: 0, high: 0, medium: 0, low: 0 };
  list.forEach(f => { c[f.severity]++; });
  return c;
}
function verdict(score) {
  return score >= 80 ? { label: 'Fewer weighted deductions', tone: 'ok' } : score >= 60 ? { label: 'Review key findings', tone: 'high' } : { label: 'Many high-impact deductions', tone: 'crit' };
}

    if (!parts.length) return screenHome();

      if (parts[1] === 'fixes') return screenFixes(parts[2] || null, params.get('select'));
      if (parts[1] === 'passport') return screenPassport(parts[2] || null);

  let last = 0;
  async function tick() {
    let s;
    try { s = await api.getAuditStatus(id); } catch (e) { nowEl.textContent = 'Connection lost. Retrying…'; return; }
    if (s.status === 'failed') { clearTimers(); nowEl.classList.remove('shimmer'); nowEl.textContent = 'The audit stopped. Check that your app is online, then start again.'; return; }
    fill.style.width = s.progress + '%'; bar.setAttribute('aria-valuenow', s.progress); pct.textContent = s.progress + '%';
    eta.textContent = s.status === 'done' ? 'Done' : s.eta_seconds < 10 ? 'Almost done' : 'About ' + s.eta_seconds + ' seconds left';
    const ev = s.events || [];
    if (ev.length !== last) {
      last = ev.length;
      nowEl.textContent = s.status === 'done' ? 'Audit complete. Opening your report…' : ev[ev.length - 1].text;
      const past = (s.status === 'done' ? ev : ev.slice(0, -1)).slice(-5).reverse();

    }
    if (s.status === 'done') { bar.classList.add('done'); clearTimers(); setTimeout(() => go('#/report/' + id), 1200); }
  }
  tick(); state.timers.push(setInterval(tick, CONFIG.POLL_MS));
}

/* 5 · Onboarding (4 steps) */
const QUESTIONS = [
  { key: 'role', title: 'What best describes you?', sub: 'We set your report view to match: plain language or technical detail.', multi: false, options: [['founder', 'Founder, non-technical'], ['dev', 'Developer'], ['agency', 'Agency or freelancer'], ['other', 'Other']] },
  { key: 'built_with', title: 'How did you build your app?', sub: 'We format fix prompts for the tool you use.', multi: false, options: [['lovable', 'Lovable'], ['bolt', 'Bolt'], ['cursor', 'Cursor or Claude Code'], ['replit', 'Replit'], ['hand', 'Coded by hand, with AI help'], ['unsure', 'Not sure']] },
  { key: 'goal', title: 'What is coming up for your app?', sub: 'Pick the closest match.', multi: false, options: [['launch', 'Launching soon', 'Review findings before going public'], ['client', 'Closing a B2B client', 'Prepare a report of scanner findings'], ['raise', 'Raising funds', 'Share a point-in-time security report'], ['incident', 'Something went wrong', 'Review scanner findings; this is not incident response']] },
  { key: 'concerns', title: 'What worries you most?', sub: 'We show these findings first.', multi: true, options: [['data', 'Customer data leaking', 'Database open to strangers'], ['secrets', 'Exposed secret keys', 'Keys visible in your code'], ['review', 'Failing a security review', 'Client questionnaire, GDPR'], ['break', 'Breaking my app', 'When applying fixes'], ['ai', 'AI features misused', 'Prompt injection in chatbots'], ['unsure', 'Honestly, not sure']] }
];
function screenOnboarding(next) {
  next = next || '#/app/dashboard';
  const answers = {}; let step = 0;
  const draw = () => {
    const summary = step >= QUESTIONS.length, q = QUESTIONS[Math.min(step, QUESTIONS.length - 1)], pct = summary ? 100 : Math.round((step + 1) / QUESTIONS.length * 100);
    const val = answers[q.key], on = id => q.multi ? (val || []).includes(id) : val === id, answered = q.multi ? (val || []).length > 0 : !!val;
    const roleT = { founder: ['Founder view by default', 'Plain-language results, technical detail one click away.'], dev: ['Developer view by default', 'Rule IDs, code snippets and exports up front.'], agency: ['Project audit view', 'Review repositories and reports one project at a time.'], other: ['Founder view by default', 'Switch to the developer view anytime.'] }[answers.role] || ['Founder view by default', ''];
    const goalT = { launch: ['Pre-launch checklist', 'What must be fixed before you go public.'], client: ['Security passport first', 'Ready to send to your client once critical issues are fixed.'], raise: ['Investor-ready report', 'A passport for your data room.'], incident: ['Incident mode', 'We check for signs of an active leak first.'] }[answers.goal] || ['Pre-launch checklist', ''];
    const builtT = 'Fix suggestions can be reviewed as a GitHub pull request or copied into your coding tool.';
    const pri = 'Findings are sorted by scanner severity; personal concern-based ranking is not applied yet.';
    $app.innerHTML = `<header style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:24px 40px"><span class="brand"><span class="orb" style="width:34px;height:34px"></span>Syberia</span><a class="btn btn-sm" href="${next}" id="skip">Skip for now</a></header>
    <main style="max-width:820px;margin:0 auto;padding:40px 24px 64px"><div class="glass" style="border-radius:40px;padding:clamp(24px,5vw,40px);display:flex;flex-direction:column;gap:30px">
      <div style="display:flex;align-items:center;gap:18px"><span class="muted" style="font-size:14px;white-space:nowrap">${summary ? 'All set' : 'Step ' + (step + 1) + ' of ' + QUESTIONS.length}</span><div class="bar" style="flex:1 1 auto;height:8px" role="progressbar" aria-label="Questionnaire progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="flow" style="width:${pct}%"></div></div><span class="mono muted" style="font-size:14px">${pct}%</span></div>
      ${summary ? `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:12px"><span class="orb orb-live" style="width:64px;height:64px"></span><h1 class="serif" style="margin:0;font-size:clamp(36px,5vw,50px);line-height:1">Your dashboard is ready</h1><p class="muted" style="margin:0;font-size:17px">Here is what we tailored for you. Change it anytime in Settings.</p></div>
        <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px">${[[roleT[0], roleT[1]], ['Fixes for your tool', builtT], [goalT[0], goalT[1]], ['Your priorities first', pri]].map(([t, d]) => `<li class="glass-soft" style="display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:22px"><span class="chip sev-fixed" style="flex:0 0 28px;height:28px;justify-content:center;padding:0;font-size:14px">✓</span><div><strong style="font-size:16px;font-weight:600">${t}</strong><div class="muted" style="font-size:14px">${d}</div></div></li>`).join('')}</ul>`
      : `<div><h1 class="serif" style="margin:0;font-size:clamp(36px,5vw,50px);line-height:1">${q.title}</h1><p class="muted" style="margin:10px 0 0;font-size:17px">${q.sub}</p></div>
        <div class="opts" role="group" aria-label="${esc(q.title)}">${q.options.map(([id, l, s]) => `<button class="btn opt" type="button" aria-pressed="${on(id)}" data-opt="${id}"><span style="font-size:17px;font-weight:500">${l}</span>${s ? `<span class="muted" style="font-size:14px;font-weight:400">${s}</span>` : ''}</button>`).join('')}</div>
        ${q.multi ? '<p class="muted" style="margin:-14px 0 0;font-size:14px">You can pick several.</p>' : ''}`}
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
        <button class="linkbtn" type="button" id="back" ${step === 0 ? 'disabled' : ''} style="text-decoration:none;font-size:17px;font-weight:500;${step === 0 ? 'opacity:.4' : ''}">← Back</button>
        ${summary ? '<button class="btn btn-lime btn-lg" type="button" id="finish">Go to my dashboard</button>' : `<button class="btn btn-mint btn-lg" type="button" id="next" ${answered ? '' : 'disabled'}>Continue</button>`}
      </div></div></main>`;
    document.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.opt;
      if (q.multi) {
        let arr = (answers[q.key] || []).slice();
        if (id === 'unsure') arr = arr.includes(id) ? [] : [id];
        else { arr = arr.filter(x => x !== 'unsure'); arr = arr.includes(id) ? arr.filter(x => x !== id) : arr.concat(id); }
        answers[q.key] = arr;
      } else answers[q.key] = id;
      draw();
    }));
    const back = document.getElementById('back'); if (back) back.addEventListener('click', () => { if (step > 0) { step--; draw(); } });
    const nx = document.getElementById('next'); if (nx) nx.addEventListener('click', () => { step++; draw(); });
    const fin = document.getElementById('finish');
    if (fin) fin.addEventListener('click', async () => {
      await api.saveOnboarding(answers);
      state.prefs = Object.assign({}, answers); state.reportView = answers.role === 'dev' ? 'dev' : 'founder';
      if (state.user) state.user.onboarded = true;
      go(next);
    });
  };
  draw();
}

/* data helpers for platform pages */
async function loadWorkspace() {
  const [projects, findings] = await Promise.all([api.listProjects(), api.listFindings()]);
  projects.forEach(p => {
    const fs = findings.filter(f => f.project_id === p.id), open = fs.filter(isOpen);
    p.findings = fs; p.score = computeScore(fs); p.counts = counts(open);
    p.code = open.filter(f => f.group === 'code').length; p.supply = open.filter(f => f.group === 'supply_chain').length;
  });
  return { projects, findings };
}
function projectsTable(projects) {

    <th style="width:28px"><input class="check" type="checkbox" id="selAll" aria-label="Select all projects"></th><th>Project</th><th>Score</th><th>Last scan</th><th class="num">Code findings</th><th class="num">Supply chain findings</th><th class="num">Scanned dependencies</th><th class="num">Workflow issues</th><th>Tags</th><th>Actions</th></tr></thead><tbody>

    </tr>`; }).join('')}</tbody></table></div>`;

function bindProjectsTable() {
  const all = document.getElementById('selAll'); if (!all) return;

    const ids = [...document.querySelectorAll('[data-sel]:checked')].map(c => c.dataset.sel);

function wireAsk() {
  const form = document.getElementById('ask'); if (!form) return;

        ${f.fix_steps && f.fix_steps.length ? `<div style="font-size:12px;color:var(--text-2);font-weight:600;margin-top:4px">How to fix</div><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.5">${f.fix_steps.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}

/* 7 · Fixes: select, fix now (batch with per-row progress), then deploy or download */
async function fixGate(reason) {
  let data; try { data = await api.githubRepos(); } catch (e) { data = { configured: false, repos: [], install_url: null }; }
  const repos = data.repos || [];
  const body = `<div class="page-head"><div><p class="eyebrow">Fixing a problem connects to your GitHub</p><h1 class="serif h1">Connect a repository to fix</h1></div></div>
    <section class="glass card stack">
      <p style="margin:0;font-size:15px;line-height:1.55">${esc(reason || 'To fix a problem, Syberia needs your GitHub repository. It signs you in with GitHub, confirms you own the repository, and opens a pull request with the fix that you review and merge.')}</p>
      <p style="margin:0;font-size:14px;color:var(--text-2);line-height:1.5">A URL or ZIP audit has no repository behind it, so there is nothing to open a pull request against. Pick a repository below to audit it and enable fixes.</p>
      ${!data.configured ? '<p class="muted">GitHub is not configured on the server yet.</p>'
      : repos.length ? `<div><div class="muted" style="font-size:13px;margin-bottom:8px">Your repositories where the Syberia app is installed:</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${repos.map(r => `<button class="btn btn-sm" type="button" data-pickrepo="${esc(r.full_name)}">${ICON_GIT}${esc(r.full_name)}${r.private ? ' · private' : ''}</button>`).join('')}</div></div>`
        : `<div class="stack"><p style="margin:0">The Syberia GitHub app is not installed on any of your repositories yet.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-mint" href="${esc(data.install_url || '#')}" target="_blank" rel="noopener">Install on a repository</a><button class="btn btn-sm" type="button" id="refreshRepos">I installed it, refresh</button></div></div>`}
    </section>`;
  $app.innerHTML = shell('fixes', body);
  document.querySelectorAll('[data-pickrepo]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = 'Starting the audit…';
    try { const { audit_id } = await api.startAudit({ type: 'deep', provider: 'github', repo_url: b.dataset.pickrepo }); state.lastAuditId = audit_id; go('#/scan/' + audit_id); }
    catch (ex) { toast('Could not start: ' + ex.message); b.disabled = false; }
  }));
  const rb = document.getElementById('refreshRepos'); if (rb) rb.addEventListener('click', () => render());
}

async function screenFixes(projectId, select) {
  const { projects } = await loadWorkspace();
  const p = projects.find(x => x.id === projectId && x.has_repo) || projects.find(x => x.id === projectId) || projects.find(x => x.has_repo) || projects[0];
  if (!p || !p.has_repo) return fixGate();
  const open = p.findings.filter(isOpen).sort((a, b) => SEV_ORDER[a.severity] - SEV_ORDER[b.severity]);
  const pre = select ? select.split(',') : open.filter(f => f.severity === 'critical' || f.severity === 'high').map(f => f.id);
  const sel = {}; open.forEach(f => { sel[f.id] = pre.includes(f.id); });
  let phase = 'select', batch = null;
  const before = computeScore(p.findings);
  const preview = () => computeScore(p.findings.filter(f => !(isOpen(f) && sel[f.id])));
  const draw = () => {
    const ids = open.filter(f => sel[f.id]).map(f => f.id), locked = phase !== 'select', after = preview();
    $app.innerHTML = shell('fixes', `<div class="page-head"><div><p class="eyebrow">${phase === 'select' ? 'Choose findings for an AI-generated proposal. Critical and high are selected for you.' : 'Selected findings are ready to send to GitHub for proposed edits.'}</p><h1 class="serif h1">Fix ${esc(p.name)}</h1></div>
        <div class="glass" style="display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:24px"><span class="muted" style="font-size:13px">Score<br><span style="font-size:11px">current → if selected findings were resolved</span></span><span class="serif" style="font-size:34px;line-height:1;color:#C42B30">${before}</span><span class="muted">→</span><span class="serif" style="font-size:46px;line-height:1;color:${after >= 80 ? 'var(--ok)' : after >= 60 ? 'var(--high)' : 'var(--crit)'}">${after}</span></div></div>
      ${projects.length > 1 ? `<div style="display:flex;flex-wrap:wrap;gap:8px">${projects.map(x => `<a class="btn btn-sm ${x.id === p.id ? 'btn-mint' : ''}" href="#/app/fixes/${x.id}" ${x.id === p.id ? 'aria-current="page"' : ''}>${esc(x.name)}</a>`).join('')}</div>` : ''}
      ${open.length || phase !== 'select' ? `<section class="glass" style="border-radius:30px;padding:10px">
        <div class="f-top" style="align-items:center;padding:12px 14px 14px">
          <label style="display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;font-weight:600"><input class="check" type="checkbox" id="all" ${ids.length === open.length && open.length ? 'checked' : ''} ${locked ? 'disabled' : ''}>Select all · ${open.length} issue${open.length === 1 ? '' : 's'} not fixed</label>
          ${phase === 'select' ? `<button class="btn btn-lime btn-lg" type="button" id="go" ${ids.length ? '' : 'disabled'}>Prepare PR (${ids.length})</button>`
            : `<span class="chip" style="font-size:14px;padding:8px 16px">${ids.length} selected · not yet tested</span>`}
        </div>
        <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px">
          ${open.map(f => { const on = sel[f.id]; return `<li class="fix-row glass-soft ${locked && !on ? 'dim' : ''}">
            <input class="check" type="checkbox" data-pick="${f.id}" ${on ? 'checked' : ''} ${locked ? 'disabled' : ''} aria-label="Select: ${esc(f.title)}" style="width:20px;height:20px">
            <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:6px"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">${sevChip(f.severity)}<strong style="font-size:16px;font-weight:600">${esc(f.title)}</strong></div><span class="mono muted" style="font-size:12px">${esc(f.file)}</span></div>
            <div class="prog"><span class="muted" style="font-size:13px">${locked ? (on ? 'Selected for the PR' : 'Not selected') : (on ? 'Ready to propose' : 'Not selected')}</span></div>
          </li>`; }).join('')}
        </ul></section>` : `<div class="glass card"><p style="margin:0">No open issues on ${esc(p.name)}. <a href="#/app/passport/${p.id}">Share the security passport</a>.</p></div>`}
      ${phase === 'select' && open.length ? '<p class="muted" style="margin:0;padding:0 8px;font-size:14px;line-height:1.5">Selected findings will be sent to the AI for a proposed code change. The change is committed to a separate GitHub branch and opened as a pull request; tests and a post-fix scan are not run automatically. Review the diff before merging.</p>' : ''}
      ${phase === 'done' ? `<section style="display:flex;flex-direction:column;gap:16px"><h2 class="serif" style="margin:0;font-size:36px;line-height:1.05">Create a pull request with AI-proposed changes.</h2>
        <p class="muted" style="margin:-6px 0 0;font-size:14px;line-height:1.5">Syberia will attempt targeted edits for the selected findings, commit successful edits to a separate branch, and open a PR. It will not run your tests or claim the fixes are verified. Your score changes only after you merge and run a new audit.</p>
        <div class="row" style="gap:16px">
          <div class="deploy insight" style="min-height:0"><div class="f-top" style="align-items:center"><strong style="font-size:18px">GitHub</strong><span class="chip glass-soft" style="color:#2F5A1A">Connected</span></div><span class="mono" style="font-size:13px;color:var(--text-2)">${esc(p.repo)} · default branch</span><span style="font-size:14px;line-height:1.45;color:var(--text-2)">A new branch and reviewable pull request. No direct push to the default branch.</span><button class="btn btn-lime" style="margin-top:auto" type="button" id="deploy">Generate changes and open PR</button></div>
        </div>
        <a class="btn" href="#/app/passport/${p.id}" style="align-self:flex-start;font-weight:500">See the updated security passport</a></section>` : ''}`);
    if (!locked) {
      document.querySelectorAll('[data-pick]').forEach(c => c.addEventListener('change', () => { sel[c.dataset.pick] = c.checked; draw(); }));
      const all = document.getElementById('all'); if (all) all.addEventListener('change', () => { open.forEach(f => sel[f.id] = all.checked); draw(); });
      const goBtn = document.getElementById('go');
      if (goBtn) goBtn.addEventListener('click', async () => {
        goBtn.disabled = true;
        try { batch = (await api.createFixBatch(p.id, ids)).batch_id; } catch (e) { toast('The fix could not start: ' + e.message); goBtn.disabled = false; return; }
        phase = 'done'; draw();
      });
    }
    const dep = document.getElementById('deploy');
    if (dep) dep.addEventListener('click', async () => {
      dep.disabled = true; dep.textContent = 'Generating AI edits and opening PR…';
      try {
        const { pr_url, patched_files = [], recommendation_count = 0, verification } = await api.deployBatch(batch, 'github');
        dep.textContent = 'Pull request opened';
        toast(`${patched_files.length} file(s) edited; ${recommendation_count} recommendation(s) need manual work. Checks: ${verification === 'not_run' ? 'not run' : 'unknown'}.`);
        window.open(pr_url, '_blank', 'noopener');
      } catch (e) {
        dep.disabled = false; dep.textContent = 'Generate changes and open PR';
        const msg = e.message || '';
        if (/not installed|install/i.test(msg)) toast('Install the Syberia GitHub App on this repo (Install button in the app settings), then retry');
        else if (/no connected GitHub repo|no pull request|has no connected/i.test(msg)) toast('This audit was run on a URL or a ZIP, so there is no repo to open a PR against. Run a deep audit on your GitHub repository to enable fixes.');
        else if (/not configured|Sign in/i.test(msg)) toast('Connect GitHub to deploy the fix');
        else toast('Deploy failed: ' + msg);
      }
    });
  };
  draw();
}

    $app.innerHTML = shell('passport', `<div class="page-head"><div><p class="eyebrow">${projects.length} audit${projects.length > 1 ? 's' : ''}</p><h1 class="serif h1">Reports &amp; passports</h1></div></div>
      <section class="glass card stack">${projects.map(p => `<div class="fix-row glass-soft" style="align-items:center;gap:12px">
        <span style="flex:1 1 240px;display:flex;flex-direction:column;gap:2px"><strong style="font-size:16px">${esc(p.name)}</strong><span class="mono muted" style="font-size:12px">${esc(p.repo || '')} · score ${p.score}/100</span></span>

  const fs = p.findings.slice().sort((a, b) => SEV_ORDER[a.severity] - SEV_ORDER[b.severity]);
  const init = initialScore(fs), score = p.score, fixed = fs.filter(f => !isOpen(f)), open = fs.filter(isOpen), v = verdict(score);
  $app.innerHTML = shell('passport', `<div class="page-head"><div><p class="eyebrow">Share it with a client, a prospect or an investor</p><h1 class="serif h1">Security passport</h1></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px" class="no-print"><button class="btn" style="font-weight:500" type="button" id="share">Copy share link</button><button class="btn btn-lime" type="button" id="pdf">Download PDF</button></div></div>
    ${projects.length > 1 ? `<div class="no-print" style="display:flex;flex-wrap:wrap;gap:8px">${projects.map(x => `<a class="btn btn-sm ${x.id === p.id ? 'btn-mint' : ''}" href="#/app/passport/${x.id}">${esc(x.name)}</a>`).join('')}</div>` : ''}
    <article class="glass" style="border-radius:36px;padding:clamp(24px,4vw,36px);display:flex;flex-direction:column;gap:28px">
      <div class="f-top" style="align-items:center;gap:24px"><div style="display:flex;flex-direction:column;gap:8px">
        <span class="mono muted" style="font-size:13px">Audited on ${fmtDate(today)} · OWASP Top 10, selected checks</span>
        <h2 class="serif" style="margin:0;font-size:64px;line-height:.95">${esc(p.name)}</h2>
        <span class="chip ${score >= 80 ? 'sev-fixed' : score >= 60 ? 'sev-high' : 'sev-critical'}" style="align-self:flex-start;font-size:13px;padding:6px 14px">${v.label}</span></div>${ring(score, 170, false)}</div>
      <div class="row" style="gap:12px">
        <div class="glass-soft" style="flex:1 1 150px;border-radius:22px;padding:18px"><span class="muted" style="font-size:13px">Score</span><div class="serif" style="font-size:34px;line-height:1"><span style="color:#C42B30">${init}</span> → <span style="color:${scoreTone(score)[1] === '#FFFFFF' ? '#C42B30' : 'var(--ok)'}">${score}</span></div></div>
        <div class="glass-soft" style="flex:1 1 150px;border-radius:22px;padding:18px"><span class="muted" style="font-size:13px">Issues found</span><div class="serif" style="font-size:34px;line-height:1">${fs.length}</div></div>
        <div class="glass-soft" style="flex:1 1 150px;border-radius:22px;padding:18px"><span class="muted" style="font-size:13px">Resolved in later audit</span><div class="serif" style="font-size:34px;line-height:1;color:var(--ok)">${fixed.length}</div></div>
        <div class="glass-soft" style="flex:1 1 150px;border-radius:22px;padding:18px"><span class="muted" style="font-size:13px">Still open</span><div class="serif" style="font-size:34px;line-height:1;color:var(--med)">${open.length}</div></div>
      </div>
      <section><h3 style="margin:0 0 8px;font-size:18px;font-weight:600">Detail of checks</h3>
        ${fs.length ? fs.map(f => `<div class="divider" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 4px"><span style="flex:1 1 260px;font-size:15px">${esc(f.title)}</span><span style="flex:0 0 90px;font-size:14px;font-weight:600;color:var(--${f.severity === 'critical' ? 'crit' : f.severity === 'high' ? 'high' : 'med'})">${SEV_LABEL[f.severity]}</span><span class="chip ${isOpen(f) ? 'sev-low' : 'sev-fixed'}" style="font-size:13px;padding:5px 12px">${isOpen(f) ? 'Open' : 'Resolved · later audit'}</span></div>`).join('') : '<p class="muted">No issues found.</p>'}
      </section>
      <p style="margin:0;font-size:14px;line-height:1.55;color:var(--muted)">A finding is marked resolved only when a later audit no longer reports it. The score starts at 100 and loses 25 points per critical, 10 per high, 3 per medium and 1 per low finding, with a 40-point deduction cap per category.</p>
      <p class="divider muted" style="margin:0;padding-top:18px;font-size:12px;line-height:1.55">Audit performed on ${fmtDate(today)} against a selection of OWASP Top 10 checks. This report describes the state of the project at that date. It is not a guarantee of security and not a certification.</p>
    </article>`);
  document.getElementById('share').addEventListener('click', async () => {
    const { url } = await api.sharePassport(p.id);
    try { await navigator.clipboard.writeText(url); toast('Share link copied'); } catch (e) { toast(url); }
  });
  // TODO(backend): replace with GET /passports/:projectId/pdf. window.print() is a stand-in (print styles hide the sidebar).
  document.getElementById('pdf').addEventListener('click', () => window.print());
}

  $app.innerHTML = shell('settings', `<div class="page-head"><div><p class="eyebrow">Your account</p><h1 class="serif h1">Settings</h1></div></div>
    <section class="glass card stack">
      <div style="display:flex;align-items:center;gap:14px"><span class="orb" style="width:44px;height:44px"></span><div><strong style="font-size:17px">${esc(u.name || 'Account')}</strong><div class="mono muted" style="font-size:13px">${esc(u.login ? '@' + u.login : (u.email || ''))}</div></div></div>
      <p style="margin:0;font-size:14px;color:var(--text-2)">Signed in with GitHub.</p>
      <div><button class="btn btn-lime" type="button" data-logout>Log out</button></div>
    </section>
    <section class="glass card stack">
      <strong style="font-size:18px">About</strong>
      <p class="mono muted" style="margin:0;font-size:13px">Syberia security audit platform. Static and passive analysis, fixes proposed as pull requests you review. No active exploitation.</p>
    </section>`);
}

/* Chatbot flottant (bulle bas-droite) avec historique conservé pendant la session */
function mountChat() {
  if (document.getElementById('sybChat')) return;
  let hist = []; try { hist = JSON.parse(localStorage.getItem('syberia_chat_v1') || '[]'); } catch (e) {}
  const wrap = document.createElement('div'); wrap.id = 'sybChat';
  wrap.innerHTML = `
    <button id="sybChatBtn" aria-label="Open the security assistant" style="position:fixed;right:20px;bottom:20px;z-index:9999;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:#C8F24A;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:24px">💬</button>
    <div id="sybChatPanel" style="position:fixed;right:20px;bottom:88px;z-index:9999;width:min(380px,calc(100vw - 40px));max-height:70vh;display:none;flex-direction:column;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,.22);overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;background:#0f1a12;color:#fff"><strong style="font-size:15px">Security assistant</strong><div style="display:flex;gap:10px;align-items:center"><button id="sybChatClear" title="Clear history" style="background:none;border:none;color:#cbd5c0;cursor:pointer;font-size:13px">Clear</button><button id="sybChatClose" aria-label="Close" style="background:none;border:none;color:#fff;cursor:pointer;font-size:20px;line-height:1">×</button></div></div>
      <div id="sybChatMsgs" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;background:#f6f7f4"></div>
      <form id="sybChatForm" style="display:flex;gap:8px;padding:10px;border-top:1px solid rgba(0,0,0,.08)"><input id="sybChatIn" type="text" placeholder="Ask about your security…" style="flex:1;min-width:0;border:1px solid rgba(0,0,0,.15);border-radius:10px;padding:10px 12px;font-size:14px"><button type="submit" style="border:none;background:#C8F24A;border-radius:10px;padding:0 14px;cursor:pointer;font-weight:600">Send</button></form>
    </div>`;
  document.body.appendChild(wrap);
  const panel = wrap.querySelector('#sybChatPanel'), msgs = wrap.querySelector('#sybChatMsgs'),
        form = wrap.querySelector('#sybChatForm'), input = wrap.querySelector('#sybChatIn');
  const save = () => { try { localStorage.setItem('syberia_chat_v1', JSON.stringify(hist.slice(-50))); } catch (e) {} };
  const bubble = (role, text) => { const d = document.createElement('div'); d.style.cssText = 'max-width:85%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;' + (role === 'user' ? 'align-self:flex-end;background:#C8F24A;color:#16301f' : 'align-self:flex-start;background:#fff;border:1px solid rgba(0,0,0,.08)'); d.textContent = text; return d; };
  const draw = () => { msgs.innerHTML = ''; if (!hist.length) { const h = document.createElement('div'); h.style.cssText = 'color:#6b7280;font-size:13px'; h.textContent = 'Ask me anything about your security, your findings, or how to fix them.'; msgs.appendChild(h); } hist.forEach(m => msgs.appendChild(bubble(m.role, m.text))); msgs.scrollTop = msgs.scrollHeight; };
  draw();
  wrap.querySelector('#sybChatBtn').addEventListener('click', () => { const open = panel.style.display === 'flex'; panel.style.display = open ? 'none' : 'flex'; if (!open) { draw(); input.focus(); } });
  wrap.querySelector('#sybChatClose').addEventListener('click', () => panel.style.display = 'none');
  wrap.querySelector('#sybChatClear').addEventListener('click', () => { hist = []; save(); draw(); });
  form.addEventListener('submit', async e => {
    e.preventDefault(); const q = input.value.trim(); if (!q) return; input.value = '';
    hist.push({ role: 'user', text: q }); draw(); save();
    const pending = bubble('bot', '…'); msgs.appendChild(pending); msgs.scrollTop = msgs.scrollHeight;
    try { const r = await api.askAssistant(q); pending.remove(); hist.push({ role: 'bot', text: r.answer || 'No answer.' }); }
    catch (ex) { pending.remove(); hist.push({ role: 'bot', text: 'Unavailable: ' + ex.message }); }
    draw(); save();
  });
}

(async () => { try { const r = await api.me(); state.user = r && r.user ? r.user : null; } catch (e) {} render(); mountChat(); syncDashboardShortcut(); })();
</script>
